name: Fast public checks

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.17.0'
      - name: Verify PHP is available
        run: php --version
      - name: Install locked test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r service/video-service/requirements.txt
          npm ci --prefix scripts/amd --ignore-scripts --no-audit --no-fund
      - name: Run offline release checks
        run: .venv/bin/python -B scripts/check_release.py
